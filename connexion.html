<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Connexion — Révise</title>

<link rel="stylesheet"
      href="css/style.css">

</head>

<body class="login-page">

<main class="login-shell">

<a class="back" href="index.html">
← Retour à Révise
</a>


<div class="login-card">

<div class="login-logo">
Révise<span>.</span>
</div>

<div class="eyebrow">
ESPACE PERSONNEL
</div>

<h1>
Bienvenue.
</h1>

<p class="sub">
Connecte-toi pour accéder à ton espace.
</p>


<form id="loginForm">

<label>
Prénom

<input
id="firstName"
type="text"
placeholder="Prénom"
required
>

</label>


<label>
Nom

<input
id="lastName"
type="text"
placeholder="Nom"
required
>

</label>


<label>
Mot de passe

<input
id="password"
type="password"
placeholder="Mot de passe"
required
>

</label>


<button
class="primary full"
type="submit"
>

Se connecter

</button>


<p
id="error"
class="error"
></p>

</form>

</div>

</main>


<script src="js/auth.js"></script>

</body>
</html>
